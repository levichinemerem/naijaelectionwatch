name: Daily Election Scrape

on:
  schedule:
    - cron: '0 8 * * *'    # 9am WAT
    - cron: '0 16 * * *'   # 5pm WAT
    - cron: '0 0 * * *'    # 1am WAT
  workflow_dispatch:        # Manual trigger from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scraper
        run: |
          echo "🚀 Starting scrape at $(date)"
          curl -f "https://naijaelectionwatch.vercel.app/api/scrape?secret=${{ secrets.SCRAPE_SECRET }}" \
            -H "User-Agent: GitHub-Actions-Scraper/1.0" \
            --silent --show-error
          echo "✅ Scrape done"